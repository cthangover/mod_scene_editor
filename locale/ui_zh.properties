tools/scene_editor/title = 场景编辑器
tools/scene_editor/hint = 场景就是一个地点：背景、环境音和剧本。Ctrl+S 保存 · 双击列表中的背景将其添加
tools/scene_editor/save_tip = 把场景文件保存到所选模组（Ctrl+S）；游戏会立即看到更改
tools/scene_editor/new_scene = + 新场景
tools/scene_editor/new_scene_tip = 创建一个新地点：名称、模组、背景。剧本可以以后再加；场景也可以没有剧本
tools/scene_editor/delete = 删除
tools/scene_editor/delete_tip = 删除所选模组中的场景文件
tools/scene_editor/delete_confirm = 从所选模组中删除这个场景的文件？场景的剧本会保留。
tools/scene_editor/go = ▶ 前往场景
tools/scene_editor/go_tip = 把游戏切换到这个场景
tools/scene_editor/rescan_tip = 重新读取场景、背景和声音（向模组添加文件后）
tools/scene_editor/scenes = 场景
tools/scene_editor/backgrounds = 场景背景（进入时随机选一个）
tools/scene_editor/all_backgrounds = 所有背景
tools/scene_editor/add_background = + 把背景加入场景
tools/scene_editor/add_background_tip = 把显示的背景加入场景（或在列表中双击它）
tools/scene_editor/remove_background = 从场景中移除背景
tools/scene_editor/properties = 属性
tools/scene_editor/name = 名称
tools/scene_editor/name_tip = 场景 id：拉丁字母、数字和 _；switch_scene 和剧本头部会引用它。只能在创建时设置
tools/scene_editor/mod = 保存到
tools/scene_editor/mod_tip = 写入场景文件的模组（仅限文件夹模组）
tools/scene_editor/ambient = 声音
tools/scene_editor/ambient_tip = 场景中播放的环境音
tools/scene_editor/listen = ▶
tools/scene_editor/listen_tip = 试听环境音
tools/scene_editor/stop = ■
tools/scene_editor/default_scenario = 默认剧本
tools/scene_editor/default_scenario_tip = 当场景没有其他剧本剩下时播放
tools/scene_editor/scenarios = 场景的剧本
tools/scene_editor/open_scenario = 打开
tools/scene_editor/open_scenario_tip = 在剧本编辑器中打开选中的剧本（或双击）
tools/scene_editor/new_scenario = + 新剧本
tools/scene_editor/new_scenario_tip = 在所选模组中创建本场景的剧本并打开
tools/scene_editor/none = — 无 —
tools/scene_editor/effective = 游戏中：{0}（来自模组 {1}）
tools/scene_editor/adds_to = 场景定义在：{0}。保存时会在所选模组中创建一个补充它的文件。
tools/scene_editor/also_in = 也补充它的有：{0}
tools/scene_editor/no_writable_mod = 没有可以保存场景的文件夹模组。
tools/scene_editor/bad_name = 请设置场景名称：拉丁字母、数字和 _（以字母开头）。
tools/scene_editor/name_taken = 场景"{0}"已存在；请在列表中选择它。
tools/scene_editor/need_background = 请至少给场景添加一个背景。
tools/scene_editor/created = 已创建场景"{0}"。
tools/scene_editor/deleted = 已删除：{0}
tools/scene_editor/opened = 场景：{0}
tools/scene_editor/new_started = 新场景：设置名称和模组，添加背景。
tools/scene_editor/already_there = 背景 {0} 已在场景中。
tools/scene_editor/go_failed = 游戏不认识场景"{0}"；请先保存它。
tools/scene_editor/went = 已切换到场景 {0}。
tools/scene_editor/rescanned = 已重新读取场景、背景和声音。
tools/scene_editor/scenario_created = 已创建剧本 {0}。
tools/scene_editor/no_scenarios = 这个场景还没有剧本
tools/scene_editor/no_backgrounds = 这个场景没有背景：在下方列表中选一个加入。
tools/scene_editor/pick_scene = 在左边选择一个场景，或创建一个新场景。
tools/scene_editor/preview_hint = 选择一个背景来查看。
tools/scene_editor/not_in_scene = （不在场景中）
tools/scene_editor/new_line_text = 一个新场景。用你的文字替换这一行。
tools/scene_editor/editor_missing = 请安装剧本编辑器以打开此文件。
